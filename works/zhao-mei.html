<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鍘美藝術節 — STUDIO 5</title>
    <link rel="icon" type="image/png" href="../assets/logo_mark.png">
    <link rel="apple-touch-icon" href="../assets/logo_mark.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100;200;400;500;600;700&family=Noto+Sans+TC:wght@100;200;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.20/dist/lenis.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            color: #333;
            background: #fff;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Hero Image */
        .hero-image {
            width: 100%;
            height: 400px;
            overflow: hidden;
            position: relative;
            z-index: 6;
            opacity: 0;
            animation: fadeIn 1s ease 0.3s forwards;
        }
        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Content Container */
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 60px;
            position: relative;
            z-index: 6;
        }

        /* Title */
        .project-title {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 0.8s ease 0.5s forwards;
            font-family: 'Noto Sans TC', sans-serif;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* Description */
        .description {
            font-size: 17px;
            line-height: 2;
            color: #555;
            margin-bottom: 80px;
            max-width: 760px;
            opacity: 0;
            animation: slideUp 0.8s ease 0.65s forwards;
        }
        .description p + p { margin-top: 1.2em; }

        /* Gallery */
        .gallery-section {
            margin-bottom: 80px;
            opacity: 0;
            transform: translateY(40px);
        }
        .gallery-section.in-view { animation: slideUp 0.8s ease forwards; }

        /* Slider */
        .slider-container {
            position: relative;
            width: 100%;
            border-radius: 0;
            overflow: hidden;
        }
        .slider-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            overflow: hidden;
        }
        .slider-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .slider-slide.active { opacity: 1; }
        .slider-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slider-nav {
            position: absolute;
            top: 0; width: 100%; height: 100%;
            display: flex; z-index: 5;
        }
        .slider-nav-left, .slider-nav-right {
            flex: 1; display: flex; align-items: center;
        }
        .slider-nav-left { justify-content: flex-start; cursor: w-resize; }
        .slider-nav-right { justify-content: flex-end; cursor: e-resize; }
        .progress-container {
            position: absolute;
            bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 10;
        }
        .progress-dot {
            position: relative; width: 8px; height: 8px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%; transition: all 0.3s; cursor: pointer;
        }
        .progress-dot.active { width: 60px; border-radius: 4px; background: rgba(255,255,255,0.3); }
        .progress-dot-fill {
            position: absolute; top: 0; left: 0;
            height: 100%; width: 0%;
            background: white; border-radius: 4px;
            transition: width 0.1s linear;
        }

        /* Single Image */
        .single-image { width: 100%; overflow: hidden; margin-bottom: 40px; }
        .single-image img { width: 100%; height: auto; display: block; }

        /* Dynamic Island */
        .dynamic-island {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; padding: 14px 48px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 10;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .content { padding: 60px 30px; }
            .project-title { font-size: 30px; }
            .description { font-size: 15px; margin-bottom: 60px; }
            .gallery-section { margin-bottom: 60px; }
            .hero-image { height: 280px; }
        }
        @media (max-width: 640px) {
            .content { padding: 40px 20px; }
            .project-title { font-size: 26px; }
            .description { font-size: 14px; line-height: 1.9; }
            .hero-image { height: 220px; }
        }

        /* ══ Nav override ══════════════════════════════════════ */
        .dynamic-island {
            position: fixed !important;
            top: 0 !important; bottom: auto !important;
            left: 0 !important; right: 0 !important;
            background: transparent !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 14px 48px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            flex-direction: row !important;
            mix-blend-mode: difference;
            transform: translateY(-100%);
            animation: slideDownNav 0.8s ease 0.3s forwards !important;
        }
        @keyframes slideDownNav { to { transform: translateY(0); } }
        .island-logo { display: block !important; transition: opacity 0.3s; }
        .island-logo:hover { opacity: 0.7 !important; }
        .island-logo img { height: 42px; display: block !important; filter: invert(1); }
        .island-nav { display: flex !important; gap: 24px; align-items: center; }
        .menu-item {
            display: block !important;
            font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif !important;
            font-size: 15px !important; letter-spacing: 0.06em;
            font-weight: 600 !important;
            color: white !important; text-decoration: none;
            transition: opacity 0.25s;
            max-width: none !important; overflow: visible !important; opacity: 1 !important;
        }
        .menu-item:hover { opacity: 0.6 !important; color: white !important; }
        @media (max-width: 968px) {
            .dynamic-island { padding: 12px 20px !important; }
            .island-logo img { height: 36px; }
        }
        @media (max-width: 640px) {
            .dynamic-island { padding: 10px 16px !important; }
            .island-logo img { height: 32px; }
            .menu-item { font-size: 12px !important; }
            .island-nav { gap: 16px; }
        }
        body { padding-top: 72px !important; }
    </style>
</head>
<body>
    <div class="hero-image">
        <img src="../assets/Zhao_Mei/Vdesign_work_XV_0.webp" alt="鍘美藝術節">
    </div>

    <div class="content">
        <h1 class="project-title">2026 年鍘美藝術節</h1>

        <div class="description">
            <p>畫面以「看戲」與「辦桌」為構圖核心，拉開的布幕、碗、筷與圓桌同框，台上演的情義與台下的人情，在同一畫面共存。</p>
            <p>本案以簡約幾何色塊為語彙延伸視覺系統；褪去繁飾，保留傳統戲曲的氣韻，讓視覺在各式製作物上有更大的彈性。</p>
        </div>

        <div class="gallery-section">
            <div class="slider-container">
                <div class="slider-wrapper">
                    <div class="slider-slide active">
                        <img src="../assets/Zhao_Mei/Vdesign_work_XV_1.webp" alt="鍘美藝術節 主視覺 1">
                    </div>
                    <div class="slider-slide">
                        <img src="../assets/Zhao_Mei/Vdesign_work_XV_2.webp" alt="鍘美藝術節 主視覺 2">
                    </div>
                </div>
                <div class="slider-nav">
                    <div class="slider-nav-left"></div>
                    <div class="slider-nav-right"></div>
                </div>
                <div class="progress-container">
                    <div class="progress-dot active" data-slide="0"><div class="progress-dot-fill"></div></div>
                    <div class="progress-dot" data-slide="1"><div class="progress-dot-fill"></div></div>
                </div>
            </div>
        </div>

        <div class="gallery-section">
            <div class="slider-container">
                <div class="slider-wrapper">
                    <div class="slider-slide active">
                        <img src="../assets/Zhao_Mei/Vdesign_work_XV_3.webp" alt="鍘美藝術節 應用 1">
                    </div>
                    <div class="slider-slide">
                        <img src="../assets/Zhao_Mei/Vdesign_work_XV_4.webp" alt="鍘美藝術節 應用 2">
                    </div>
                </div>
                <div class="slider-nav">
                    <div class="slider-nav-left"></div>
                    <div class="slider-nav-right"></div>
                </div>
                <div class="progress-container">
                    <div class="progress-dot active" data-slide="0"><div class="progress-dot-fill"></div></div>
                    <div class="progress-dot" data-slide="1"><div class="progress-dot-fill"></div></div>
                </div>
            </div>
        </div>

        <div class="gallery-section">
            <div class="slider-container">
                <div class="slider-wrapper">
                    <div class="slider-slide active">
                        <img src="../assets/Zhao_Mei/Vdesign_work_XV_6.webp" alt="鍘美藝術節 細節 1">
                    </div>
                    <div class="slider-slide">
                        <img src="../assets/Zhao_Mei/Vdesign_work_XV_5.webp" alt="鍘美藝術節 細節 2">
                    </div>
                </div>
                <div class="slider-nav">
                    <div class="slider-nav-left"></div>
                    <div class="slider-nav-right"></div>
                </div>
                <div class="progress-container">
                    <div class="progress-dot active" data-slide="0"><div class="progress-dot-fill"></div></div>
                    <div class="progress-dot" data-slide="1"><div class="progress-dot-fill"></div></div>
                </div>
            </div>
        </div>

        <div class="gallery-section">
            <div class="single-image">
                <img src="../assets/Zhao_Mei/Vdesign_work_XV_7.webp" alt="鍘美藝術節 全圖">
            </div>
        </div>
    </div>

    <div class="dynamic-island">
        <a href="https://vdesign5.github.io/home/" class="island-logo">
            <img src="../assets/logo_mark.png" alt="STUDIO 5">
        </a>
        <nav class="island-nav">
            <a href="https://vdesign5.github.io/home/" class="menu-item">Works</a>
            <a href="https://vdesign5.github.io/home/works/about" class="menu-item">About</a>
            <a href="https://vdesign5.github.io/home/#contact" class="menu-item">Contact</a>
        </nav>
    </div>

    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            orientation: 'vertical',
            gestureOrientation: 'vertical',
            smoothWheel: true,
            wheelMultiplier: 1,
            smoothTouch: false,
            touchMultiplier: 2,
            infinite: false,
        });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        class AutoSlider {
            constructor(container) {
                this.container = container;
                this.slides = container.querySelectorAll('.slider-slide');
                this.navLeft = container.querySelector('.slider-nav-left');
                this.navRight = container.querySelector('.slider-nav-right');
                this.progressContainer = container.querySelector('.progress-container');
                this.progressDots = this.progressContainer.querySelectorAll('.progress-dot');
                this.progressFills = this.progressContainer.querySelectorAll('.progress-dot-fill');
                this.currentSlide = 0;
                this.autoPlayDuration = 5000;
                this.autoPlayInterval = null;
                this.progressStartTime = null;
                this.progressAnimationFrame = null;
                this.init();
            }
            init() {
                if (this.navLeft) this.navLeft.addEventListener('click', () => { this.showSlide(this.currentSlide - 1); this.resetAutoPlay(); });
                if (this.navRight) this.navRight.addEventListener('click', () => { this.showSlide(this.currentSlide + 1); this.resetAutoPlay(); });
                this.progressDots.forEach((dot, index) => {
                    dot.addEventListener('click', () => { this.showSlide(index); this.resetAutoPlay(); });
                });
                this.startAutoPlay();
                this.startProgressAnimation();
            }
            showSlide(index) {
                this.slides.forEach(slide => slide.classList.remove('active'));
                this.currentSlide = (index + this.slides.length) % this.slides.length;
                this.slides[this.currentSlide].classList.add('active');
                this.progressDots.forEach((dot, i) => { dot.classList.remove('active'); this.progressFills[i].style.width = '0%'; });
                this.progressDots[this.currentSlide].classList.add('active');
                this.startProgressAnimation();
            }
            startProgressAnimation() {
                this.progressStartTime = Date.now();
                const animate = () => {
                    const elapsed = Date.now() - this.progressStartTime;
                    const progress = Math.min((elapsed / this.autoPlayDuration) * 100, 100);
                    const currentFill = this.progressFills[this.currentSlide];
                    if (currentFill) currentFill.style.width = progress + '%';
                    if (progress < 100) this.progressAnimationFrame = requestAnimationFrame(animate);
                };
                if (this.progressAnimationFrame) cancelAnimationFrame(this.progressAnimationFrame);
                animate();
            }
            startAutoPlay() {
                if (this.autoPlayInterval) clearInterval(this.autoPlayInterval);
                this.autoPlayInterval = setInterval(() => { this.showSlide(this.currentSlide + 1); }, this.autoPlayDuration);
            }
            resetAutoPlay() { this.startAutoPlay(); }
        }

        document.querySelectorAll('.slider-container').forEach(container => { new AutoSlider(container); });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('in-view'); observer.unobserve(entry.target); }
            });
        }, { root: null, rootMargin: '0px', threshold: 0.1 });

        document.querySelectorAll('.gallery-section').forEach(section => { observer.observe(section); });
    </script>
</body>
</html>
